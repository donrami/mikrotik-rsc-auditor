name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Test imports
        run: |
          python -c "
          from scripts.audit_rsc import RSCAuditor
          from scripts.cve_database import check_cve_for_version, parse_version, version_matches_pattern
          from scripts.conflict_analyzer import ConflictAnalyzer, ConflictType
          from scripts.conflict_explanations import get_explanation
          from scripts.ioc_analyzer import IoCAnalyzer, IoCType
          import scripts.lint_rsc
          print('All imports OK')
          "
      - name: Syntax check
        run: python -m py_compile scripts/audit_rsc.py
      - name: CVE database sanity
        run: |
          python -c "
          from scripts.cve_database import check_cve_for_version
          cves = check_cve_for_version('7.5')
          assert len(cves) > 0, 'No CVEs found for v7.5'
          v6_cves = check_cve_for_version('6.42.6')
          v7_only = [c for c in v6_cves if all(not v.startswith('6.') and '6.*' not in v for v in c.affected_versions)]
          assert len(v7_only) == 0, f'v6 got v7-only CVEs: {[c.cve_id for c in v7_only]}'
          print(f'CVE sanity: {len(cves)} CVEs for v7.5, v6={len(v6_cves)} (no v7-only)')
          "
      - name: Linter test
        run: |
          python -c "
          import scripts.lint_rsc as linter
          # Non-sensitive command should not be flagged
          result = linter.lint_text(':global myVar "hello"')
          assert len(result) == 0, f'Should not flag global decl: {result}'
          # Unguarded add on sensitive menu IS a real finding (idempotency warning)
          result = linter.lint_text('/ip firewall filter add chain=input action=accept')
          assert len(result) > 0, 'Should flag unguarded add on firewall'
          result = linter.lint_text('/system reset-configuration')
          assert len(result) > 0, 'Should flag destructive command'
          print(f'Linter: destruction detected ({len(result)} findings)')
          "
