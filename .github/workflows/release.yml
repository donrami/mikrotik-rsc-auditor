name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: Publish to PyPI
        run: |
          twine upload dist/* \
            --username __token__ \
            --password ${{ secrets.PYPI_API_TOKEN }} \
            --skip-existing

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node (use runner's default, ensure npm ≥11)
        run: |
          echo "Node: $(node -v), npm: $(npm -v)"
          if [ "$(npm -v | cut -d. -f1)" -lt 11 ]; then
            npm install -g npm@latest
            echo "Upgraded npm to $(npm -v)"
          fi
      - name: Publish to npm
        run: npm publish --access public
