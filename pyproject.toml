[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrotik-rsc-auditor"
version = "0.2.0"
description = "Offline static analysis tool for auditing MikroTik RouterOS .rsc configuration files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mikrotik", "routeros", "security", "audit", "rsc", "firewall", "compliance"]
authors = [
    {name = "MikroTik RSC Auditor Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/donrami/mikrotik-rsc-auditor"
Repository = "https://github.com/donrami/mikrotik-rsc-auditor"
Documentation = "https://github.com/donrami/mikrotik-rsc-auditor#readme"
Issues = "https://github.com/donrami/mikrotik-rsc-auditor/issues"
Changelog = "https://github.com/donrami/mikrotik-rsc-auditor/releases"

[tool.setuptools.packages.find]
include = ["scripts*", "tests*"]

[project.scripts]
mikrotik-audit = "scripts.audit_rsc:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
